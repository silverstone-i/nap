# PR gate: every check that must be green before code lands on main.
# The release workflow (release-on-merge.yml) re-runs the same checks
# pre-bump; keep the script names in both files matched to package.json.

name: CI

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

permissions:
  contents: read

# A superseded push should stop spending a Postgres job. Keyed on ref so PR
# runs cancel their own predecessors while main runs stay independent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    env:
      # ARCH-004: a central administration database and a cell database, on
      # one instance here but with separate pools, migrations, and lifecycles.
      # ARCH-019: nap_app is the least-privileged runtime role; nap_admin owns
      # the tables and is used only by the migration runners. Both are defined
      # in docs/specs/nap-platform-specification.md.
      SETUP_DATABASE_TEST: localhost:5432/postgres
      ADMIN_DATABASE_TEST: localhost:5432/nap_admin_test
      CELL_DATABASES_TEST: '{"00000000-0000-4000-8000-000000000001":"localhost:5432/nap_cell_test"}'
      NAP_APP_PSWD_TEST: nap_test_runtime
      NAP_ADMIN_PSWD_TEST: nap_test
      REDIS_URL_TEST: redis://127.0.0.1:6379

    services:
      redis:
        image: redis:8
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nap_admin
          POSTGRES_PASSWORD: nap_test
          POSTGRES_DB: nap_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nap_admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Ensure PostgreSQL 18 client
        # pg_dump must match the service's major version for recovery tests.
        # https://www.postgresql.org/download/linux/ubuntu/
        run: |
          if [ ! -x /usr/lib/postgresql/18/bin/pg_dump ]; then
            # Runner images include unrelated vendor repositories (for example
            # Chrome). Their index failures must not block PostgreSQL setup.
            apt_backup="$RUNNER_TEMP/nap-disabled-apt-sources"
            sudo mkdir -p "$apt_backup"
            for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
              [ -e "$source" ] || continue
              case "${source##*/}" in
                ubuntu.list|ubuntu.sources|pgdg.list|pgdg.sources) ;;
                *) sudo mv "$source" "$apt_backup/" ;;
              esac
            done
            sudo apt-get update
            sudo apt-get install -y postgresql-common ca-certificates
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get update
            sudo apt-get install -y postgresql-client-18
          fi
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Set up databases
        run: npm run db:setup:test -- --cell-id 00000000-0000-4000-8000-000000000001

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: License check
        run: npm run licenses
