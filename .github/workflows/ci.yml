# PR gate: every check that must be green before code lands on main.
# The release workflow (release-on-merge.yml) re-runs the same checks
# pre-bump; keep the script names in both files matched to package.json.

name: CI

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nap_admin
          POSTGRES_PASSWORD: nap_test
          POSTGRES_DB: nap_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nap_admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          DATABASE_URL_TEST: postgres://nap_admin:nap_test@localhost:5432/nap_test

      - name: Build
        run: npm run build
