# NAP release contract: docs/RULES/release-operations.md.
name: Release on Merge

on:
  pull_request:
    types: [closed]
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      # npm ci runs the root "prepare" script, which activates husky's hooks
      # in the runner; HUSKY=0 keeps them out of the bot's bump commit.
      HUSKY: 0
      # ARCH-004: a central administration database and a cell database, on
      # one instance here but with separate pools, migrations, and lifecycles.
      # ARCH-019: nap_app is the least-privileged runtime role; nap_admin owns
      # the tables and is used only by the migration runners. Both are defined
      # in docs/specs/nap-platform-specification.md.
      SETUP_ADMIN_URL_TEST: postgres://nap_admin:nap_test@localhost:5432/postgres
      ADMIN_DATABASE_URL_TEST: postgres://nap_app:nap_test@localhost:5432/nap_admin_test
      ADMIN_MIGRATION_URL_TEST: postgres://nap_admin:nap_test@localhost:5432/nap_admin_test
      CELL_DATABASE_URL_TEST: postgres://nap_app:nap_test@localhost:5432/nap_cell_test
      CELL_MIGRATION_URL_TEST: postgres://nap_admin:nap_test@localhost:5432/nap_cell_test
      REDIS_URL_TEST: redis://127.0.0.1:6379
      ADMIN_RUNTIME_ROLE: nap_app
      CELL_RUNTIME_ROLE: nap_app

    # Mirrors ci.yml: the pre-bump checks below are the same checks, so they
    # need the same database or a release fails on tests that just passed.
    services:
      redis:
        image: redis:8
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nap_admin
          POSTGRES_PASSWORD: nap_test
          POSTGRES_DB: nap_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nap_admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Select unreleased batch
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs select

      - name: Recover baseline GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs recover

      - name: Install dependencies
        if: steps.bump.outputs.type != 'none'
        run: npm ci

      - name: Lint
        if: contains(fromJSON('["patch","minor","major"]'), steps.bump.outputs.type)
        run: npm run lint

      - name: Format check
        if: contains(fromJSON('["patch","minor","major"]'), steps.bump.outputs.type)
        run: npm run format:check

      - name: Typecheck
        if: contains(fromJSON('["patch","minor","major"]'), steps.bump.outputs.type)
        run: npm run typecheck

      - name: Ensure PostgreSQL 18 client
        if: steps.bump.outputs.type != 'none'
        # pg_dump must match the service's major version for recovery tests.
        # https://www.postgresql.org/download/linux/ubuntu/
        run: |
          if [ ! -x /usr/lib/postgresql/18/bin/pg_dump ]; then
            # Runner images include unrelated vendor repositories (for example
            # Chrome). Their index failures must not block PostgreSQL setup.
            apt_backup="$RUNNER_TEMP/nap-disabled-apt-sources"
            sudo mkdir -p "$apt_backup"
            for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
              [ -e "$source" ] || continue
              case "${source##*/}" in
                ubuntu.list|ubuntu.sources|pgdg.list|pgdg.sources) ;;
                *) sudo mv "$source" "$apt_backup/" ;;
              esac
            done
            sudo apt-get update
            sudo apt-get install -y postgresql-common ca-certificates
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get update
            sudo apt-get install -y postgresql-client-18
          fi
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Set up databases
        if: contains(fromJSON('["patch","minor","major"]'), steps.bump.outputs.type)
        run: npm run db:setup:test

      - name: Test
        if: contains(fromJSON('["patch","minor","major"]'), steps.bump.outputs.type)
        env:
          CI: true
        run: npm test

      - name: Build
        if: contains(fromJSON('["patch","minor","major"]'), steps.bump.outputs.type)
        run: npm run build

      - name: License check
        if: contains(fromJSON('["patch","minor","major"]'), steps.bump.outputs.type)
        run: npm run licenses

      - name: Publish checked version and GitHub Release
        if: steps.bump.outputs.type != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ steps.bump.outputs.type }}
          RELEASE_SNAPSHOT: ${{ steps.bump.outputs.snapshot }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.mjs publish
