# Claude Code reviews each pull request with its bundled /code-review at
# medium effort and posts findings as inline review threads, the same
# channel Copilot uses, so /ship review, /ship fix, and Auto-fix act on them.
name: Claude Code Review

on:
  pull_request:
    # Once per PR, not per push: the review does not dedupe against threads it
    # already posted. Close and reopen the PR to review its latest commit; a
    # re-run from the Actions tab reviews the commit the PR was opened at.
    types: [opened, reopened, ready_for_review]
    branches: ['main', 'dev']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts wait for ready_for_review; fork PRs get no secrets.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Review with Claude Code
        # Pinned to a commit: this third-party action holds the API key and a
        # write token, so a moved tag must not change what runs.
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Plain words, not a bare slash command: in a non-interactive run
          # "/code-review" alone ends before Claude takes a turn.
          prompt: >-
            Use the Skill tool to run the code-review skill with arguments
            "medium --comment ${{ github.event.pull_request.number }}",
            then follow its instructions to post the findings as inline
            comments on pull request ${{ github.event.pull_request.number }}.
          # Same-repo PRs only (see `if` above), so the report is trusted.
          display_report: true
          claude_args: >-
            --allowedTools "Skill,Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git rev-parse:*),Bash(git merge-base:*)"
