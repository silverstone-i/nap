# Claude Code reviews each pull request with its bundled /code-review at
# medium effort and posts findings as inline review threads, the same
# channel Copilot uses, so /ship review, /ship fix, and Auto-fix act on them.
name: Claude Code Review

on:
  pull_request:
    # Once per PR, not per push: the review does not dedupe against threads it
    # already posted. A draft is reviewed when marked ready, and again each
    # time it goes back to draft and is marked ready. To review the latest
    # commit again, add the `claude-review` label (remove it first if it is
    # already on the PR). Reopening a PR does not review it.
    types: [opened, ready_for_review, labeled]
    branches: ['main', 'dev']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  # Never cancel a running review, which would leave part of its threads
  # posted. GitHub keeps one pending run per group, so a newer request
  # replaces an older one still waiting.
  cancel-in-progress: false

jobs:
  review:
    # Drafts wait for ready_for_review; fork PRs get no secrets; bot PRs
    # (Dependabot, release automation) have neither the key nor write access.
    # A label event reviews only for `claude-review`. A PR opened with that
    # label sends `opened` and `labeled`; the `labeled` run reviews it.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot' &&
      (github.event.action != 'labeled' ||
      github.event.label.name == 'claude-review') &&
      (github.event.action != 'opened' ||
      !contains(github.event.pull_request.labels.*.name, 'claude-review'))
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        run: echo "REVIEW_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          # The PR head, not the merge commit, so line numbers match the diff
          # the inline comments anchor to. Full history keeps the merge base
          # available for git diff and git log.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Fail early and plainly when the Claude token secret is missing.
      # A present but expired or revoked token still fails in the next step
      # with Anthropic's sign-in error. To replace it, run
      # `claude setup-token`, then `gh secret set CLAUDE_CODE_OAUTH_TOKEN`.
      - name: Check Claude token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Run 'claude setup-token', then 'gh secret set CLAUDE_CODE_OAUTH_TOKEN'."
            exit 1
          fi
      - name: Review with Claude Code
        # Pinned to a commit: this third-party action holds the Claude token
        # and a write token, so a moved tag must not change what runs.
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          # Signs in with the Claude Max plan (`claude setup-token`), so
          # reviews count against its usage limits instead of API credit.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Plain words, not a bare slash command: in a non-interactive run
          # "/code-review" alone ends before Claude takes a turn.
          prompt: >-
            Use the Skill tool to run the code-review skill with arguments
            "medium --comment ${{ github.event.pull_request.number }}",
            then follow its instructions to post the findings as inline
            comments on pull request ${{ github.event.pull_request.number }}.
          # Same-repo PRs only (see `if` above), so the report is trusted.
          display_report: true
          # Agent lets the review fan out to subagents, which keep these same
          # tool limits.
          claude_args: >-
            --allowedTools "Skill,Agent,Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git rev-parse:*),Bash(git merge-base:*)"
      # The review can finish green without posting, for example if the
      # inline-comment tool is missing. Report the count; warn on zero, which
      # can also mean a clean review.
      - name: Count posted comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          count=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and .commit_id == \"$HEAD_SHA\" and .created_at >= \"$REVIEW_STARTED\")] | length" \
            | awk '{ total += $1 } END { print total + 0 }')
          echo "Claude Code posted $count inline comment(s) on $HEAD_SHA." >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -eq 0 ]; then
            echo "::warning::Claude Code posted no inline comments. Check the report above: the review may have found nothing, or it could not post."
          fi
