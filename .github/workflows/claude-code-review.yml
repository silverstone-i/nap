# Claude Code reviews each pull request with its bundled /code-review at
# medium effort and posts findings as inline review threads, the same
# channel Copilot uses, so /ship review, /ship fix, and Auto-fix act on them.
name: Claude Code Review

on:
  pull_request:
    # Once per PR, not per push: the review does not dedupe against threads it
    # already posted. Re-run the workflow from the Actions tab to review again.
    types: [opened, reopened, ready_for_review]
    branches: ['main', 'dev']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts wait for ready_for_review; fork PRs get no secrets.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Review with Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: /code-review medium --comment ${{ github.event.pull_request.number }}
          claude_args: >-
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git rev-parse:*),Bash(git merge-base:*)"
